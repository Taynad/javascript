<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Qual a sua nacionalidade?</h1>
    Informe o país <input type="text" name="nacionalidade" id="pais">
    <input type="button" value="Verificar" onclick="naciolidade ()">
    <div id="resultado"></div>
    

    <script>
        function naciolidade(){
            var n = window.document.getElementById('pais');
            var paisSelecionado = n.value;
            var result = window.document.getElementById('resultado');
            
            if( paisSelecionado != 'Brasil' ){
                result.textContent ='Você é estrangeiro'
            }else{
                result.textContent = 'Você é brasileiro'
            }

        }
    </script>
</body>
</html>
